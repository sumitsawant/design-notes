<svg xmlns="http://www.w3.org/2000/svg" width="900" height="601" viewBox="0 0 900 601" role="img" aria-labelledby="title desc"><title id="title">Request sequence / Cache miss</title><desc id="desc">1. Client to API: Get product. 2. API to Cache: Look up key. 3. Cache to API: Key is absent. 4. API to Database: Read product. 5. Database to API: Return product. 6. API to Cache: Store copy with expiry. 7. API to Client: Return product.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#294637"/></marker></defs><rect width="900" height="601" rx="12" fill="#ffffff"/><text x="30" y="30" fill="#294637" font-family="Arial, sans-serif" font-size="14" text-anchor="start" paint-order="stroke" stroke="#ffffff" stroke-width="0" stroke-linejoin="round">Request sequence / Cache miss</text><rect x="3.0" y="50" width="124" height="42" rx="6" fill="#edf4ed"/><text x="65.0" y="76" fill="#294637" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="0" stroke-linejoin="round">Client</text><path d="M65.0 96V586" stroke="#a5b8a9" stroke-dasharray="4 6"/><rect x="259.6666666666667" y="50" width="124" height="42" rx="6" fill="#edf4ed"/><text x="321.6666666666667" y="76" fill="#294637" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="0" stroke-linejoin="round">API</text><path d="M321.6666666666667 96V586" stroke="#a5b8a9" stroke-dasharray="4 6"/><rect x="516.3333333333334" y="50" width="124" height="42" rx="6" fill="#edf4ed"/><text x="578.3333333333334" y="76" fill="#294637" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="0" stroke-linejoin="round">Cache</text><path d="M578.3333333333334 96V586" stroke="#a5b8a9" stroke-dasharray="4 6"/><rect x="773.0" y="50" width="124" height="42" rx="6" fill="#edf4ed"/><text x="835.0" y="76" fill="#294637" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="0" stroke-linejoin="round">Database</text><path d="M835.0 96V586" stroke="#a5b8a9" stroke-dasharray="4 6"/><text x="193.33333333333334" y="120" fill="#294637" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">1. Get product</text><path d="M65.0 130H321.6666666666667" fill="none" stroke="#294637" stroke-width="1.5" marker-end="url(#arrow)"/><text x="450.0" y="188" fill="#294637" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">2. Look up key</text><path d="M321.6666666666667 198H578.3333333333334" fill="none" stroke="#294637" stroke-width="1.5" marker-end="url(#arrow)"/><text x="450.0" y="256" fill="#294637" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">3. Key is absent</text><path d="M578.3333333333334 266H321.6666666666667" fill="none" stroke="#294637" stroke-width="1.5" marker-end="url(#arrow)"/><text x="578.3333333333334" y="324" fill="#294637" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">4. Read product</text><path d="M321.6666666666667 334H835.0" fill="none" stroke="#294637" stroke-width="1.5" marker-end="url(#arrow)"/><text x="578.3333333333334" y="392" fill="#294637" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">5. Return product</text><path d="M835.0 402H321.6666666666667" fill="none" stroke="#294637" stroke-width="1.5" marker-end="url(#arrow)"/><text x="450.0" y="460" fill="#294637" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">6. Store copy with expiry</text><path d="M321.6666666666667 470H578.3333333333334" fill="none" stroke="#294637" stroke-width="1.5" marker-end="url(#arrow)"/><text x="193.33333333333334" y="528" fill="#294637" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">7. Return product</text><path d="M321.6666666666667 538H65.0" fill="none" stroke="#294637" stroke-width="1.5" marker-end="url(#arrow)"/></svg>