<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-labelledby="title desc"><title id="title">Message queues / System</title><desc id="desc">Client to Job API: Request. Job API to Database: One transaction. Database to Outbox publisher: Pending jobs. Outbox publisher to Queue: Publish. Queue to Worker: Deliver.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#294637"/></marker></defs><rect width="900" height="400" rx="12" fill="#ffffff"/><text x="30" y="35" fill="#294637" font-family="Arial, sans-serif" font-size="16" text-anchor="start" paint-order="stroke" stroke="#ffffff" stroke-width="0" stroke-linejoin="round">Message queues / System</text><path d="M245 139H355" fill="none" stroke="#294637" stroke-width="1.6" marker-end="url(#arrow)"/><text x="300.0" y="126" fill="#294637" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">Request</text><path d="M545 139H655" fill="none" stroke="#294637" stroke-width="1.6" marker-end="url(#arrow)"/><text x="600.0" y="126" fill="#294637" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">One transaction</text><path d="M750 173V229.0H750V285" fill="none" stroke="#294637" stroke-width="1.6" marker-end="url(#arrow)"/><text x="760.0" y="217.0" fill="#294637" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">Pending jobs</text><path d="M655 319H545" fill="none" stroke="#294637" stroke-width="1.6" marker-end="url(#arrow)"/><text x="600.0" y="306" fill="#294637" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">Publish</text><path d="M355 319H245" fill="none" stroke="#294637" stroke-width="1.6" marker-end="url(#arrow)"/><text x="300.0" y="306" fill="#294637" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">Deliver</text><rect x="55" y="105" width="190" height="68" rx="8" fill="#eeeee6" stroke="#ccdbcc"/><text x="150" y="133" fill="#294637" font-family="Arial, sans-serif" font-size="17" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="0" stroke-linejoin="round">Client</text><text x="150" y="154" fill="#62675f" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="0" stroke-linejoin="round">Requests an export</text><rect x="355" y="105" width="190" height="68" rx="8" fill="#edf4ed" stroke="#ccdbcc"/><text x="450" y="133" fill="#294637" font-family="Arial, sans-serif" font-size="17" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="0" stroke-linejoin="round">Job API</text><text x="450" y="154" fill="#62675f" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="0" stroke-linejoin="round">Creates a job</text><rect x="655" y="105" width="190" height="68" rx="8" fill="#edf4ed" stroke="#ccdbcc"/><text x="750" y="133" fill="#294637" font-family="Arial, sans-serif" font-size="17" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="0" stroke-linejoin="round">Database</text><text x="750" y="154" fill="#62675f" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="0" stroke-linejoin="round">Job and outbox records</text><rect x="55" y="285" width="190" height="68" rx="8" fill="#edf4ed" stroke="#ccdbcc"/><text x="150" y="313" fill="#294637" font-family="Arial, sans-serif" font-size="17" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="0" stroke-linejoin="round">Worker</text><text x="150" y="334" fill="#62675f" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="0" stroke-linejoin="round">Processes the export</text><rect x="355" y="285" width="190" height="68" rx="8" fill="#edf4ed" stroke="#ccdbcc"/><text x="450" y="313" fill="#294637" font-family="Arial, sans-serif" font-size="17" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="0" stroke-linejoin="round">Queue</text><text x="450" y="334" fill="#62675f" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="0" stroke-linejoin="round">Holds job messages</text><rect x="655" y="285" width="190" height="68" rx="8" fill="#edf4ed" stroke="#ccdbcc"/><text x="750" y="313" fill="#294637" font-family="Arial, sans-serif" font-size="17" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="0" stroke-linejoin="round">Outbox publisher</text><text x="750" y="334" fill="#62675f" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="0" stroke-linejoin="round">Publishes saved jobs</text></svg>