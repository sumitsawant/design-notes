<svg xmlns="http://www.w3.org/2000/svg" width="900" height="669" viewBox="0 0 900 669" role="img" aria-labelledby="title desc"><title id="title">Request sequence / Durable job handoff</title><desc id="desc">1. Job API to Database: Save job and outbox in one transaction. 2. Database to Job API: Commit succeeds. 3. Job API to Job API: Return accepted status to the client. 4. Publisher to Database: Read pending outbox entries. 5. Database to Publisher: Return saved job. 6. Publisher to Queue: Publish job with stable ID. 7. Queue to Publisher: Confirm publication. 8. Publisher to Database: Mark outbox entry as published.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#242925"/></marker></defs><rect width="900" height="669" rx="12" fill="#faf9f5"/><text x="30" y="30" fill="#242925" font-family="Arial, sans-serif" font-size="14" text-anchor="start" paint-order="stroke" stroke="#faf9f5" stroke-width="4" stroke-linejoin="round">Request sequence / Durable job handoff</text><rect x="3.0" y="50" width="124" height="42" rx="6" fill="#dfeee6"/><text x="65.0" y="76" fill="#242925" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" paint-order="stroke" stroke="#faf9f5" stroke-width="4" stroke-linejoin="round">Job API</text><path d="M65.0 96V654" stroke="#8b978b" stroke-dasharray="4 6"/><rect x="259.6666666666667" y="50" width="124" height="42" rx="6" fill="#dfeee6"/><text x="321.6666666666667" y="76" fill="#242925" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" paint-order="stroke" stroke="#faf9f5" stroke-width="4" stroke-linejoin="round">Database</text><path d="M321.6666666666667 96V654" stroke="#8b978b" stroke-dasharray="4 6"/><rect x="516.3333333333334" y="50" width="124" height="42" rx="6" fill="#dfeee6"/><text x="578.3333333333334" y="76" fill="#242925" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" paint-order="stroke" stroke="#faf9f5" stroke-width="4" stroke-linejoin="round">Publisher</text><path d="M578.3333333333334 96V654" stroke="#8b978b" stroke-dasharray="4 6"/><rect x="773.0" y="50" width="124" height="42" rx="6" fill="#dfeee6"/><text x="835.0" y="76" fill="#242925" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" paint-order="stroke" stroke="#faf9f5" stroke-width="4" stroke-linejoin="round">Queue</text><path d="M835.0 96V654" stroke="#8b978b" stroke-dasharray="4 6"/><text x="193.33333333333334" y="120" fill="#242925" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" paint-order="stroke" stroke="#faf9f5" stroke-width="4" stroke-linejoin="round">1. Save job and outbox in one transaction</text><path d="M65.0 130H321.6666666666667" fill="none" stroke="#242925" stroke-width="1.5" marker-end="url(#arrow)"/><text x="193.33333333333334" y="188" fill="#242925" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" paint-order="stroke" stroke="#faf9f5" stroke-width="4" stroke-linejoin="round">2. Commit succeeds</text><path d="M321.6666666666667 198H65.0" fill="none" stroke="#242925" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="15" y="241" width="870" height="44" rx="5" fill="#f6ded0"/><text x="450" y="268" fill="#242925" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" paint-order="stroke" stroke="#faf9f5" stroke-width="4" stroke-linejoin="round">3. Return accepted status to the client</text><text x="450.0" y="324" fill="#242925" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" paint-order="stroke" stroke="#faf9f5" stroke-width="4" stroke-linejoin="round">4. Read pending outbox entries</text><path d="M578.3333333333334 334H321.6666666666667" fill="none" stroke="#242925" stroke-width="1.5" marker-end="url(#arrow)"/><text x="450.0" y="392" fill="#242925" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" paint-order="stroke" stroke="#faf9f5" stroke-width="4" stroke-linejoin="round">5. Return saved job</text><path d="M321.6666666666667 402H578.3333333333334" fill="none" stroke="#242925" stroke-width="1.5" marker-end="url(#arrow)"/><text x="706.6666666666667" y="460" fill="#242925" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" paint-order="stroke" stroke="#faf9f5" stroke-width="4" stroke-linejoin="round">6. Publish job with stable ID</text><path d="M578.3333333333334 470H835.0" fill="none" stroke="#242925" stroke-width="1.5" marker-end="url(#arrow)"/><text x="706.6666666666667" y="528" fill="#242925" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" paint-order="stroke" stroke="#faf9f5" stroke-width="4" stroke-linejoin="round">7. Confirm publication</text><path d="M835.0 538H578.3333333333334" fill="none" stroke="#242925" stroke-width="1.5" marker-end="url(#arrow)"/><text x="450.0" y="596" fill="#242925" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" paint-order="stroke" stroke="#faf9f5" stroke-width="4" stroke-linejoin="round">8. Mark outbox entry as published</text><path d="M578.3333333333334 606H321.6666666666667" fill="none" stroke="#242925" stroke-width="1.5" marker-end="url(#arrow)"/></svg>