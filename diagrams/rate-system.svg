<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-labelledby="title desc"><title id="title">Rate limiting / System</title><desc id="desc">Client to API gateway: Request. API gateway to Application API: Allow. API gateway to Limit store: Atomic check.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#242925"/></marker></defs><rect width="900" height="400" rx="12" fill="#faf9f5"/><text x="30" y="35" fill="#242925" font-family="Arial, sans-serif" font-size="16" text-anchor="start" paint-order="stroke" stroke="#faf9f5" stroke-width="4" stroke-linejoin="round">Rate limiting / System</text><path d="M245 139H355" fill="none" stroke="#242925" stroke-width="1.6" marker-end="url(#arrow)"/><text x="300.0" y="126" fill="#242925" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" paint-order="stroke" stroke="#faf9f5" stroke-width="4" stroke-linejoin="round">Request</text><path d="M545 139H655" fill="none" stroke="#242925" stroke-width="1.6" marker-end="url(#arrow)"/><text x="600.0" y="126" fill="#242925" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" paint-order="stroke" stroke="#faf9f5" stroke-width="4" stroke-linejoin="round">Allow</text><path d="M450 173V229.0H150V285" fill="none" stroke="#242925" stroke-width="1.6" marker-end="url(#arrow)"/><text x="310.0" y="217.0" fill="#242925" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" paint-order="stroke" stroke="#faf9f5" stroke-width="4" stroke-linejoin="round">Atomic check</text><rect x="55" y="105" width="190" height="68" rx="8" fill="#eeeee6" stroke="#bdcbbb"/><text x="150" y="133" fill="#242925" font-family="Arial, sans-serif" font-size="17" text-anchor="middle" paint-order="stroke" stroke="#faf9f5" stroke-width="4" stroke-linejoin="round">Client</text><text x="150" y="154" fill="#62675f" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" paint-order="stroke" stroke="#faf9f5" stroke-width="4" stroke-linejoin="round">Sends an account identity</text><rect x="355" y="105" width="190" height="68" rx="8" fill="#dfeee6" stroke="#bdcbbb"/><text x="450" y="133" fill="#242925" font-family="Arial, sans-serif" font-size="17" text-anchor="middle" paint-order="stroke" stroke="#faf9f5" stroke-width="4" stroke-linejoin="round">API gateway</text><text x="450" y="154" fill="#62675f" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" paint-order="stroke" stroke="#faf9f5" stroke-width="4" stroke-linejoin="round">Checks the policy</text><rect x="655" y="105" width="190" height="68" rx="8" fill="#dfeee6" stroke="#bdcbbb"/><text x="750" y="133" fill="#242925" font-family="Arial, sans-serif" font-size="17" text-anchor="middle" paint-order="stroke" stroke="#faf9f5" stroke-width="4" stroke-linejoin="round">Application API</text><text x="750" y="154" fill="#62675f" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" paint-order="stroke" stroke="#faf9f5" stroke-width="4" stroke-linejoin="round">Processes allowed work</text><rect x="55" y="285" width="190" height="68" rx="8" fill="#dfeee6" stroke="#bdcbbb"/><text x="150" y="313" fill="#242925" font-family="Arial, sans-serif" font-size="17" text-anchor="middle" paint-order="stroke" stroke="#faf9f5" stroke-width="4" stroke-linejoin="round">Limit store</text><text x="150" y="334" fill="#62675f" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" paint-order="stroke" stroke="#faf9f5" stroke-width="4" stroke-linejoin="round">Shared account counters</text></svg>