<svg xmlns="http://www.w3.org/2000/svg" width="900" height="601" viewBox="0 0 900 601" role="img" aria-labelledby="title desc"><title id="title">Recovery / Cache is unavailable</title><desc id="desc">1. Client to API: Get product. 2. API to Cache: Look up key. 3. API to API: Cache request times out. 4. API to API: Check the database traffic limit. 5. API to Database: Read only if capacity is available. 6. Database to API: Return product. 7. API to Client: Return product.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#242925"/></marker></defs><rect width="900" height="601" rx="12" fill="#faf9f5"/><text x="30" y="30" fill="#242925" font-family="Arial, sans-serif" font-size="14" text-anchor="start" paint-order="stroke" stroke="#faf9f5" stroke-width="0" stroke-linejoin="round">Recovery / Cache is unavailable</text><rect x="3.0" y="50" width="124" height="42" rx="6" fill="#dfeee6"/><text x="65.0" y="76" fill="#242925" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" paint-order="stroke" stroke="#faf9f5" stroke-width="0" stroke-linejoin="round">Client</text><path d="M65.0 96V586" stroke="#8b978b" stroke-dasharray="4 6"/><rect x="259.6666666666667" y="50" width="124" height="42" rx="6" fill="#dfeee6"/><text x="321.6666666666667" y="76" fill="#242925" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" paint-order="stroke" stroke="#faf9f5" stroke-width="0" stroke-linejoin="round">API</text><path d="M321.6666666666667 96V586" stroke="#8b978b" stroke-dasharray="4 6"/><rect x="516.3333333333334" y="50" width="124" height="42" rx="6" fill="#dfeee6"/><text x="578.3333333333334" y="76" fill="#242925" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" paint-order="stroke" stroke="#faf9f5" stroke-width="0" stroke-linejoin="round">Cache</text><path d="M578.3333333333334 96V586" stroke="#8b978b" stroke-dasharray="4 6"/><rect x="773.0" y="50" width="124" height="42" rx="6" fill="#dfeee6"/><text x="835.0" y="76" fill="#242925" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" paint-order="stroke" stroke="#faf9f5" stroke-width="0" stroke-linejoin="round">Database</text><path d="M835.0 96V586" stroke="#8b978b" stroke-dasharray="4 6"/><text x="193.33333333333334" y="120" fill="#242925" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" paint-order="stroke" stroke="#faf9f5" stroke-width="4" stroke-linejoin="round">1. Get product</text><path d="M65.0 130H321.6666666666667" fill="none" stroke="#242925" stroke-width="1.5" marker-end="url(#arrow)"/><text x="450.0" y="188" fill="#242925" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" paint-order="stroke" stroke="#faf9f5" stroke-width="4" stroke-linejoin="round">2. Look up key</text><path d="M321.6666666666667 198H578.3333333333334" fill="none" stroke="#242925" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="15" y="241" width="870" height="44" rx="5" fill="#f6ded0"/><text x="450" y="268" fill="#242925" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" paint-order="stroke" stroke="#faf9f5" stroke-width="0" stroke-linejoin="round">3. Cache request times out</text><rect x="15" y="309" width="870" height="44" rx="5" fill="#f6ded0"/><text x="450" y="336" fill="#242925" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" paint-order="stroke" stroke="#faf9f5" stroke-width="0" stroke-linejoin="round">4. Check the database traffic limit</text><text x="578.3333333333334" y="392" fill="#242925" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" paint-order="stroke" stroke="#faf9f5" stroke-width="4" stroke-linejoin="round">5. Read only if capacity is available</text><path d="M321.6666666666667 402H835.0" fill="none" stroke="#242925" stroke-width="1.5" marker-end="url(#arrow)"/><text x="578.3333333333334" y="460" fill="#242925" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" paint-order="stroke" stroke="#faf9f5" stroke-width="4" stroke-linejoin="round">6. Return product</text><path d="M835.0 470H321.6666666666667" fill="none" stroke="#242925" stroke-width="1.5" marker-end="url(#arrow)"/><text x="193.33333333333334" y="528" fill="#242925" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" paint-order="stroke" stroke="#faf9f5" stroke-width="4" stroke-linejoin="round">7. Return product</text><path d="M321.6666666666667 538H65.0" fill="none" stroke="#242925" stroke-width="1.5" marker-end="url(#arrow)"/></svg>