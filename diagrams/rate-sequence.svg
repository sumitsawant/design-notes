<svg xmlns="http://www.w3.org/2000/svg" width="900" height="533" viewBox="0 0 900 533" role="img" aria-labelledby="title desc"><title id="title">Request sequence / Limit permits the request</title><desc id="desc">1. Client to Gateway: Send authenticated request. 2. Gateway to Limit store: Check and consume one token atomically. 3. Limit store to Gateway: Allow request. 4. Gateway to API: Forward request. 5. API to Gateway: Return result. 6. Gateway to Client: Return result.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#242925"/></marker></defs><rect width="900" height="533" rx="12" fill="#faf9f5"/><text x="30" y="30" fill="#242925" font-family="Arial, sans-serif" font-size="14" text-anchor="start" paint-order="stroke" stroke="#faf9f5" stroke-width="0" stroke-linejoin="round">Request sequence / Limit permits the request</text><rect x="3.0" y="50" width="124" height="42" rx="6" fill="#dfeee6"/><text x="65.0" y="76" fill="#242925" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" paint-order="stroke" stroke="#faf9f5" stroke-width="0" stroke-linejoin="round">Client</text><path d="M65.0 96V518" stroke="#8b978b" stroke-dasharray="4 6"/><rect x="259.6666666666667" y="50" width="124" height="42" rx="6" fill="#dfeee6"/><text x="321.6666666666667" y="76" fill="#242925" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" paint-order="stroke" stroke="#faf9f5" stroke-width="0" stroke-linejoin="round">Gateway</text><path d="M321.6666666666667 96V518" stroke="#8b978b" stroke-dasharray="4 6"/><rect x="516.3333333333334" y="50" width="124" height="42" rx="6" fill="#dfeee6"/><text x="578.3333333333334" y="76" fill="#242925" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" paint-order="stroke" stroke="#faf9f5" stroke-width="0" stroke-linejoin="round">Limit store</text><path d="M578.3333333333334 96V518" stroke="#8b978b" stroke-dasharray="4 6"/><rect x="773.0" y="50" width="124" height="42" rx="6" fill="#dfeee6"/><text x="835.0" y="76" fill="#242925" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" paint-order="stroke" stroke="#faf9f5" stroke-width="0" stroke-linejoin="round">API</text><path d="M835.0 96V518" stroke="#8b978b" stroke-dasharray="4 6"/><text x="193.33333333333334" y="120" fill="#242925" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" paint-order="stroke" stroke="#faf9f5" stroke-width="4" stroke-linejoin="round">1. Send authenticated request</text><path d="M65.0 130H321.6666666666667" fill="none" stroke="#242925" stroke-width="1.5" marker-end="url(#arrow)"/><text x="450.0" y="188" fill="#242925" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" paint-order="stroke" stroke="#faf9f5" stroke-width="4" stroke-linejoin="round">2. Check and consume one token atomically</text><path d="M321.6666666666667 198H578.3333333333334" fill="none" stroke="#242925" stroke-width="1.5" marker-end="url(#arrow)"/><text x="450.0" y="256" fill="#242925" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" paint-order="stroke" stroke="#faf9f5" stroke-width="4" stroke-linejoin="round">3. Allow request</text><path d="M578.3333333333334 266H321.6666666666667" fill="none" stroke="#242925" stroke-width="1.5" marker-end="url(#arrow)"/><text x="578.3333333333334" y="324" fill="#242925" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" paint-order="stroke" stroke="#faf9f5" stroke-width="4" stroke-linejoin="round">4. Forward request</text><path d="M321.6666666666667 334H835.0" fill="none" stroke="#242925" stroke-width="1.5" marker-end="url(#arrow)"/><text x="578.3333333333334" y="392" fill="#242925" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" paint-order="stroke" stroke="#faf9f5" stroke-width="4" stroke-linejoin="round">5. Return result</text><path d="M835.0 402H321.6666666666667" fill="none" stroke="#242925" stroke-width="1.5" marker-end="url(#arrow)"/><text x="193.33333333333334" y="460" fill="#242925" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" paint-order="stroke" stroke="#faf9f5" stroke-width="4" stroke-linejoin="round">6. Return result</text><path d="M321.6666666666667 470H65.0" fill="none" stroke="#242925" stroke-width="1.5" marker-end="url(#arrow)"/></svg>