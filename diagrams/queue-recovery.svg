<svg xmlns="http://www.w3.org/2000/svg" width="900" height="669" viewBox="0 0 900 669" role="img" aria-labelledby="title desc"><title id="title">Recovery / Worker stops before acknowledgement</title><desc id="desc">1. Queue to Worker: Deliver job ID. 2. Worker to Result store: Save result under job ID. 3. Result store to Worker: Result saved. 4. Worker to Worker: Worker stops before acknowledgement. 5. Queue to Worker: Deliver the same job again. 6. Worker to Result store: Find completed result by job ID. 7. Result store to Worker: Return saved result. 8. Worker to Queue: Acknowledge completed job.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#242925"/></marker></defs><rect width="900" height="669" rx="12" fill="#faf9f5"/><text x="30" y="30" fill="#242925" font-family="Arial, sans-serif" font-size="14" text-anchor="start" paint-order="stroke" stroke="#faf9f5" stroke-width="4" stroke-linejoin="round">Recovery / Worker stops before acknowledgement</text><rect x="3.0" y="50" width="124" height="42" rx="6" fill="#dfeee6"/><text x="65.0" y="76" fill="#242925" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" paint-order="stroke" stroke="#faf9f5" stroke-width="4" stroke-linejoin="round">Queue</text><path d="M65.0 96V654" stroke="#8b978b" stroke-dasharray="4 6"/><rect x="388.0" y="50" width="124" height="42" rx="6" fill="#dfeee6"/><text x="450.0" y="76" fill="#242925" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" paint-order="stroke" stroke="#faf9f5" stroke-width="4" stroke-linejoin="round">Worker</text><path d="M450.0 96V654" stroke="#8b978b" stroke-dasharray="4 6"/><rect x="773.0" y="50" width="124" height="42" rx="6" fill="#dfeee6"/><text x="835.0" y="76" fill="#242925" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" paint-order="stroke" stroke="#faf9f5" stroke-width="4" stroke-linejoin="round">Result store</text><path d="M835.0 96V654" stroke="#8b978b" stroke-dasharray="4 6"/><text x="257.5" y="120" fill="#242925" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" paint-order="stroke" stroke="#faf9f5" stroke-width="4" stroke-linejoin="round">1. Deliver job ID</text><path d="M65.0 130H450.0" fill="none" stroke="#242925" stroke-width="1.5" marker-end="url(#arrow)"/><text x="642.5" y="188" fill="#242925" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" paint-order="stroke" stroke="#faf9f5" stroke-width="4" stroke-linejoin="round">2. Save result under job ID</text><path d="M450.0 198H835.0" fill="none" stroke="#242925" stroke-width="1.5" marker-end="url(#arrow)"/><text x="642.5" y="256" fill="#242925" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" paint-order="stroke" stroke="#faf9f5" stroke-width="4" stroke-linejoin="round">3. Result saved</text><path d="M835.0 266H450.0" fill="none" stroke="#242925" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="15" y="309" width="870" height="44" rx="5" fill="#f6ded0"/><text x="450" y="336" fill="#242925" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" paint-order="stroke" stroke="#faf9f5" stroke-width="4" stroke-linejoin="round">4. Worker stops before acknowledgement</text><text x="257.5" y="392" fill="#242925" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" paint-order="stroke" stroke="#faf9f5" stroke-width="4" stroke-linejoin="round">5. Deliver the same job again</text><path d="M65.0 402H450.0" fill="none" stroke="#242925" stroke-width="1.5" marker-end="url(#arrow)"/><text x="642.5" y="460" fill="#242925" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" paint-order="stroke" stroke="#faf9f5" stroke-width="4" stroke-linejoin="round">6. Find completed result by job ID</text><path d="M450.0 470H835.0" fill="none" stroke="#242925" stroke-width="1.5" marker-end="url(#arrow)"/><text x="642.5" y="528" fill="#242925" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" paint-order="stroke" stroke="#faf9f5" stroke-width="4" stroke-linejoin="round">7. Return saved result</text><path d="M835.0 538H450.0" fill="none" stroke="#242925" stroke-width="1.5" marker-end="url(#arrow)"/><text x="257.5" y="596" fill="#242925" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" paint-order="stroke" stroke="#faf9f5" stroke-width="4" stroke-linejoin="round">8. Acknowledge completed job</text><path d="M450.0 606H65.0" fill="none" stroke="#242925" stroke-width="1.5" marker-end="url(#arrow)"/></svg>