<svg xmlns="http://www.w3.org/2000/svg" width="900" height="465" viewBox="0 0 900 465" role="img" aria-labelledby="title desc"><title id="title">Failure policy / Limit store is unavailable</title><desc id="desc">1. Client to Gateway: Request an expensive operation. 2. Gateway to Limit store: Check account limit. 3. Gateway to Gateway: Limit store request times out. 4. Gateway to Gateway: Apply the configured reject policy. 5. Gateway to Client: Return temporary service error.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#242925"/></marker></defs><rect width="900" height="465" rx="12" fill="#faf9f5"/><text x="30" y="30" fill="#242925" font-family="Arial, sans-serif" font-size="14" text-anchor="start" paint-order="stroke" stroke="#faf9f5" stroke-width="4" stroke-linejoin="round">Failure policy / Limit store is unavailable</text><rect x="3.0" y="50" width="124" height="42" rx="6" fill="#dfeee6"/><text x="65.0" y="76" fill="#242925" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" paint-order="stroke" stroke="#faf9f5" stroke-width="4" stroke-linejoin="round">Client</text><path d="M65.0 96V450" stroke="#8b978b" stroke-dasharray="4 6"/><rect x="388.0" y="50" width="124" height="42" rx="6" fill="#dfeee6"/><text x="450.0" y="76" fill="#242925" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" paint-order="stroke" stroke="#faf9f5" stroke-width="4" stroke-linejoin="round">Gateway</text><path d="M450.0 96V450" stroke="#8b978b" stroke-dasharray="4 6"/><rect x="773.0" y="50" width="124" height="42" rx="6" fill="#dfeee6"/><text x="835.0" y="76" fill="#242925" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" paint-order="stroke" stroke="#faf9f5" stroke-width="4" stroke-linejoin="round">Limit store</text><path d="M835.0 96V450" stroke="#8b978b" stroke-dasharray="4 6"/><text x="257.5" y="120" fill="#242925" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" paint-order="stroke" stroke="#faf9f5" stroke-width="4" stroke-linejoin="round">1. Request an expensive operation</text><path d="M65.0 130H450.0" fill="none" stroke="#242925" stroke-width="1.5" marker-end="url(#arrow)"/><text x="642.5" y="188" fill="#242925" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" paint-order="stroke" stroke="#faf9f5" stroke-width="4" stroke-linejoin="round">2. Check account limit</text><path d="M450.0 198H835.0" fill="none" stroke="#242925" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="15" y="241" width="870" height="44" rx="5" fill="#f6ded0"/><text x="450" y="268" fill="#242925" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" paint-order="stroke" stroke="#faf9f5" stroke-width="4" stroke-linejoin="round">3. Limit store request times out</text><rect x="15" y="309" width="870" height="44" rx="5" fill="#f6ded0"/><text x="450" y="336" fill="#242925" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" paint-order="stroke" stroke="#faf9f5" stroke-width="4" stroke-linejoin="round">4. Apply the configured reject policy</text><text x="257.5" y="392" fill="#242925" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" paint-order="stroke" stroke="#faf9f5" stroke-width="4" stroke-linejoin="round">5. Return temporary service error</text><path d="M450.0 402H65.0" fill="none" stroke="#242925" stroke-width="1.5" marker-end="url(#arrow)"/></svg>