<svg xmlns="http://www.w3.org/2000/svg" width="900" height="805" viewBox="0 0 900 805" role="img" aria-labelledby="title desc"><title id="title">Recovery / Charge succeeds before the server stops</title><desc id="desc">1. Order API to Payment service: Charge with saved payment key. 2. Payment service to Order API: Charge succeeds. 3. Order API to Order API: Server stops before saving the result. 4. Customer to Order API: Retry with the same request ID. 5. Order API to Database: Read the saved operation. 6. Database to Order API: Return pending status and payment key. 7. Order API to Payment service: Retry with the same payment key. 8. Payment service to Order API: Return existing payment result. 9. Order API to Database: Save result and update order state. 10. Order API to Customer: Confirm order.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#294637"/></marker></defs><rect width="900" height="805" rx="12" fill="#ffffff"/><text x="30" y="30" fill="#294637" font-family="Arial, sans-serif" font-size="14" text-anchor="start" paint-order="stroke" stroke="#ffffff" stroke-width="0" stroke-linejoin="round">Recovery / Charge succeeds before the server stops</text><rect x="3.0" y="50" width="124" height="42" rx="6" fill="#edf4ed"/><text x="65.0" y="76" fill="#294637" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="0" stroke-linejoin="round">Customer</text><path d="M65.0 96V790" stroke="#a5b8a9" stroke-dasharray="4 6"/><rect x="259.6666666666667" y="50" width="124" height="42" rx="6" fill="#edf4ed"/><text x="321.6666666666667" y="76" fill="#294637" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="0" stroke-linejoin="round">Order API</text><path d="M321.6666666666667 96V790" stroke="#a5b8a9" stroke-dasharray="4 6"/><rect x="516.3333333333334" y="50" width="124" height="42" rx="6" fill="#edf4ed"/><text x="578.3333333333334" y="76" fill="#294637" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="0" stroke-linejoin="round">Database</text><path d="M578.3333333333334 96V790" stroke="#a5b8a9" stroke-dasharray="4 6"/><rect x="773.0" y="50" width="124" height="42" rx="6" fill="#edf4ed"/><text x="835.0" y="76" fill="#294637" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="0" stroke-linejoin="round">Payment service</text><path d="M835.0 96V790" stroke="#a5b8a9" stroke-dasharray="4 6"/><text x="578.3333333333334" y="120" fill="#294637" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">1. Charge with saved payment key</text><path d="M321.6666666666667 130H835.0" fill="none" stroke="#294637" stroke-width="1.5" marker-end="url(#arrow)"/><text x="578.3333333333334" y="188" fill="#294637" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">2. Charge succeeds</text><path d="M835.0 198H321.6666666666667" fill="none" stroke="#294637" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="15" y="241" width="870" height="44" rx="5" fill="#f4ebda"/><text x="450" y="268" fill="#294637" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="0" stroke-linejoin="round">3. Server stops before saving the result</text><text x="193.33333333333334" y="324" fill="#294637" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">4. Retry with the same request ID</text><path d="M65.0 334H321.6666666666667" fill="none" stroke="#294637" stroke-width="1.5" marker-end="url(#arrow)"/><text x="450.0" y="392" fill="#294637" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">5. Read the saved operation</text><path d="M321.6666666666667 402H578.3333333333334" fill="none" stroke="#294637" stroke-width="1.5" marker-end="url(#arrow)"/><text x="450.0" y="460" fill="#294637" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">6. Return pending status and payment key</text><path d="M578.3333333333334 470H321.6666666666667" fill="none" stroke="#294637" stroke-width="1.5" marker-end="url(#arrow)"/><text x="578.3333333333334" y="528" fill="#294637" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">7. Retry with the same payment key</text><path d="M321.6666666666667 538H835.0" fill="none" stroke="#294637" stroke-width="1.5" marker-end="url(#arrow)"/><text x="578.3333333333334" y="596" fill="#294637" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">8. Return existing payment result</text><path d="M835.0 606H321.6666666666667" fill="none" stroke="#294637" stroke-width="1.5" marker-end="url(#arrow)"/><text x="450.0" y="664" fill="#294637" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">9. Save result and update order state</text><path d="M321.6666666666667 674H578.3333333333334" fill="none" stroke="#294637" stroke-width="1.5" marker-end="url(#arrow)"/><text x="193.33333333333334" y="732" fill="#294637" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">10. Confirm order</text><path d="M321.6666666666667 742H65.0" fill="none" stroke="#294637" stroke-width="1.5" marker-end="url(#arrow)"/></svg>